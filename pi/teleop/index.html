<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>MAZE2027 пульт</title>
<style>
  :root { --bg: #15171a; --card: #1f2226; --fg: #d7dadf; --dim: #8a9099;
          --go: #2e9d55; --stop: #c8413a; --acc: #f2a900; }
  * { box-sizing: border-box; }
  html, body { overscroll-behavior: none; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
         font: 16px/1.4 -apple-system, system-ui, sans-serif; max-width: 560px; margin-inline: auto;
         user-select: none; -webkit-user-select: none; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .card { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .dim { color: var(--dim); font-size: 14px; }
  .bad { color: #ff6b62; font-weight: 600; }
  .ok { color: var(--go); font-weight: 600; }
  #pad { position: relative; width: min(84vw, 340px); aspect-ratio: 1; margin: 8px auto;
         border-radius: 50%; background: radial-gradient(#2a2e33, #1a1c20);
         border: 2px solid #3a3f46; touch-action: none; }
  #pad::before, #pad::after { content: ""; position: absolute; background: #333840; }
  #pad::before { left: 50%; top: 8%; bottom: 8%; width: 2px; }
  #pad::after { top: 50%; left: 8%; right: 8%; height: 2px; }
  #knob { position: absolute; width: 32%; aspect-ratio: 1; left: 34%; top: 34%; z-index: 1;
          border-radius: 50%; background: var(--acc); box-shadow: 0 4px 14px #0008; }
  #pad.active #knob { background: var(--go); }
  input[type=range] { width: 100%; height: 32px; }
  #wheels { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<h1>MAZE2027 · пульт моторов</h1>

<div class="card row">
  <span>ESP: <span id="esp" class="dim">—</span></span>
  <span id="wheels" class="dim">Л 0 · П 0 см/с</span>
</div>

<div class="card">
  <div id="pad"><div id="knob"></div></div>
  <div class="dim" style="text-align:center">держи и веди пальцем · отпустил — стоп</div>
</div>

<div class="card">
  <div class="row"><span>Скорость</span><span id="speedv">30 см/с</span></div>
  <input id="speed" type="range" min="5" max="60" step="5" value="30">
</div>

<script>
const pad = document.getElementById("pad"), knob = document.getElementById("knob");
const speedEl = document.getElementById("speed");
let x = 0, y = 0, active = false, busy = false;

speedEl.oninput = () => document.getElementById("speedv").textContent = speedEl.value + " см/с";

function moveKnob() {
  knob.style.left = (34 + x * 34) + "%";
  knob.style.top = (34 - y * 34) + "%";
}

function fromPointer(e) {
  const b = pad.getBoundingClientRect(), rad = b.width / 2;
  let dx = (e.clientX - b.left - rad) / rad, dy = -(e.clientY - b.top - rad) / rad;
  const len = Math.hypot(dx, dy);
  if (len > 1) { dx /= len; dy /= len; }
  x = dx; y = dy;
  moveKnob();
}

function release() {
  active = false; x = 0; y = 0;
  pad.classList.remove("active");
  moveKnob();
  send(true);
}

pad.addEventListener("pointerdown", e => {
  pad.setPointerCapture(e.pointerId);
  active = true; pad.classList.add("active");
  fromPointer(e); send(true);
});
pad.addEventListener("pointermove", e => { if (active) fromPointer(e); });
pad.addEventListener("pointerup", release);
pad.addEventListener("pointercancel", release);
document.addEventListener("visibilitychange", () => { if (document.hidden) release(); });
window.addEventListener("blur", release);

async function send(force) {
  if (busy && !force) return;
  busy = true;
  try {
    const r = await fetch("/drive", { method: "POST",
      body: JSON.stringify({ x, y, speed: +speedEl.value }) });
    const d = await r.json();
    const esp = document.getElementById("esp");
    esp.textContent = d.esp_hz ? d.esp_hz + " пак/с" : "нет связи";
    esp.className = d.esp_hz ? "ok" : "bad";
    document.getElementById("wheels").textContent = `Л ${d.l} · П ${d.r} см/с`;
  } catch (err) {
    const esp = document.getElementById("esp");
    esp.textContent = "пульт недоступен"; esp.className = "bad";
  } finally { busy = false; }
}

// Пока палец на джойстике - команда каждые 100 мс (робот стоит, если они перестали
// приходить дольше 0,3 с). Без пальца раз в секунду - только чтобы видеть связь.
setInterval(() => { if (active) send(false); }, 100);
setInterval(() => { if (!active) send(false); }, 1000);
</script>
</body>
</html>
